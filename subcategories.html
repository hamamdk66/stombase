<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StomBase — Раздел</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222;
padding:30px 20px;
}

.container{
max-width:1200px;
margin:auto;
}

.back{
display:inline-block;
margin-bottom:25px;
text-decoration:none;
color:#0066ff;
font-weight:bold;
}

h1{
font-size:38px;
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.card h3{
color:#0066ff;
margin-bottom:8px;
}

.card p{
color:#666;
}

.error{
color:#d00;
}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back">
← Назад
</a>

<h1 id="title">
Загрузка...
</h1>

<div class="grid" id="subcategoriesGrid">

<div class="card">
<h3>Загрузка...</h3>
<p>Получаем разделы...</p>
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://ldqrrahczzxbausnevtr.supabase.co";

const supabaseKey =
"sb_publishable_TRxcPX5BSxmXBlrHl2bnAA_RADPKXza";

const db =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);


const params =
new URLSearchParams(
window.location.search
);

const categoryId =
params.get("id");


async function loadSubcategories(){

const grid =
document.getElementById(
"subcategoriesGrid"
);

const title =
document.getElementById(
"title"
);


if(!categoryId){

title.textContent =
"Раздел не найден";

grid.innerHTML =
"<div class='card'><h3 class='error'>Не указан ID категории</h3></div>";

return;

}


const result =
await db
.from("subcategories")
.select("*")
.eq("category_id", categoryId)
.order("id");


if(result.error){

console.error(result.error);

title.textContent =
"Ошибка";

grid.innerHTML = `
<div class="card">
<h3 class="error">
Ошибка загрузки
</h3>

<p>
${result.error.message}
</p>

</div>
`;

return;

}


const data =
result.data;


if(!data || data.length === 0){

title.textContent =
"Подкатегории";

grid.innerHTML = `
<div class="card">
<h3>Пока пусто</h3>
<p>
В этом разделе пока нет материалов.
</p>
</div>
`;

return;

}


title.textContent =
"Раздел StomBase";


grid.innerHTML = "";


data.forEach(item => {

grid.innerHTML += `

<div class="card">

<h3>
${item.name}
</h3>

<p>
Материалы раздела
</p>

</div>

`;

});

}


loadSubcategories();

</script>

</body>
</html>
