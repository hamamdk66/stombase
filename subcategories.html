<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подкатегории — StomBase</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
cursor:pointer;
}

.card h3{
color:#0066ff;
margin:0;
}

.back{
display:inline-block;
margin-bottom:30px;
text-decoration:none;
color:#0066ff;
font-weight:bold;
}

</style>
</head>
<body>

<a href="index.html" class="back">← На главную</a>

<h1 id="title">Подкатегории</h1>

<div class="grid" id="subcategoriesGrid">
<div class="card">
<h3>Загрузка...</h3>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://ldqrrahczzxbausnevtr.supabase.co";
const supabaseKey = "sb_publishable_TRxcPX5BSxmXBlrHl2bnAA_RADPKXza";

const supabase = window.supabase.createClient(
supabaseUrl,
supabaseKey
);

const params = new URLSearchParams(window.location.search);
const categoryId = params.get("id");

async function loadSubcategories(){

const grid = document.getElementById("subcategoriesGrid");

const { data, error } = await supabase
.from("subcategories")
.select("*")
.eq("category_id", categoryId)
.order("id");

if(error){

grid.innerHTML =
`<div class="card">
<h3>Ошибка</h3>
<p>${error.message}</p>
</div>`;

return;
}

grid.innerHTML = "";

data.forEach(item => {

grid.innerHTML += `
<div class="card">
<h3>${item.name}</h3>
</div>
`;

});

}

loadSubcategories();

</script>

</body>
</html>
