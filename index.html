<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StomBase</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0066ff;
}
</style>

</head>
<body>

<h1>🦷 StomBase</h1>

<div class="grid" id="categoriesGrid">
<div class="card">
<h3>Загрузка...</h3>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://ldqrrahczzxbausnevtr.supabase.co";
const supabaseKey = "ТВОЙ_PUBLISHABLE_KEY_ЦЕЛИКОМ";

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

async function loadCategories(){

const grid =
document.getElementById("categoriesGrid");

const { data, error } =
await supabase
.from("categories")
.select("*")
.order("id");

if(error){

grid.innerHTML =
"<div class='card'><h3>Ошибка</h3><p>" +
error.message +
"</p></div>";

return;
}

grid.innerHTML = "";

data.forEach(category => {

grid.innerHTML += `
<div class="card">
<h3>${category.name}</h3>
</div>
`;

});

}

loadCategories();

</script>

</body>
</html>
